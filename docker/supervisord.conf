; claude-phone-local - all five services in one container.
; Everything talks over 127.0.0.1 here, which is why the unified image needs no
; Docker DNS names and sidesteps the bridge-networking issues of the split setup.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:freeswitch]
command=/entrypoint.sh freeswitch
  --sip-port 5080
  --rtp-range-start %(ENV_RTP_START)s
  --rtp-range-end %(ENV_RTP_END)s
  --ext-rtp-ip %(ENV_EXTERNAL_IP)s
  --ext-sip-ip %(ENV_FS_SIP_IP)s
  --advertise-external-ip
  -- -nc -nf
priority=10
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_events_enabled=true

[program:drachtio]
command=/usr/local/bin/drachtio
  --contact sip:*:5070;transport=tcp,udp
  --external-ip %(ENV_EXTERNAL_IP)s
  --secret %(ENV_DRACHTIO_SECRET)s
  --port 9022
  --loglevel info
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:stt]
command=/opt/venv/bin/uvicorn server:app --host 127.0.0.1 --port 9001
directory=/opt/stt
environment=HF_HOME="/data/models/huggingface",HOME="/root"
priority=20
autorestart=true
; the first run downloads the Whisper model, which can take several minutes
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tts]
command=/opt/venv/bin/uvicorn server:app --host 127.0.0.1 --port 9002
directory=/opt/tts
environment=PIPER_VOICES_DIR="/data/voices"
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:voice-app]
command=/usr/bin/node index.js
directory=/app
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
