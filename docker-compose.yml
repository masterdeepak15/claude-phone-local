# claude-phone-local - one container, one volume.
#
# All five services (drachtio, FreeSWITCH, voice-app, STT, TTS) run inside a
# single image and talk over 127.0.0.1, so there is no container DNS to get
# wrong. Everything that must survive a restart lives in ./data:
#
#   ./data/voices   Piper voice models   (downloaded on first run)
#   ./data/models   Whisper model cache  (downloaded on first run)
#   ./data/config   devices.json         (generated once, then yours to edit)
#   ./data/audio    generated speech     (scratch)
#
# The previous five-container layout is preserved in docker-compose.multi.yml.
#
# EXTERNAL_IP in .env must be this PC's LAN IP (run `ipconfig` / `ip addr`) --
# it is the address 3CX sends SIP and RTP to.

services:
  claude-phone:
    build: .
    image: claude-phone-local:latest
    container_name: claude-phone
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Everything is in-process now, so all hosts are loopback.
      - DRACHTIO_HOST=127.0.0.1
      - FREESWITCH_HOST=127.0.0.1
      - STT_LOCAL_URL=http://127.0.0.1:9001
      - TTS_LOCAL_URL=http://127.0.0.1:9002
      - AUDIO_BASE_URL=http://127.0.0.1:3000
      - RTP_START=30000
      - RTP_END=30100
    ports:
      - "3000:3000"                      # HTTP API + audio file serving
      - "5070:5070/udp"                  # drachtio SIP
      - "5070:5070/tcp"
      - "30000-30100:30000-30100/udp"    # RTP
    volumes:
      - ./data:/data
